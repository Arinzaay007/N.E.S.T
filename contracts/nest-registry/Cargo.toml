[package]
name = "nest-registry"
version = "0.1.0"
edition = "2021"
description = "NEST handle registry and USDC payment router for NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
