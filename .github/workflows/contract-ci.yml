name: NEAR contract CI

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contract-ci.yml"
  push:
    paths:
      - "contracts/**"
      - ".github/workflows/contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build registry WASM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/nest-registry
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust and NEAR WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/nest-registry

      - name: Run contract unit tests
        shell: bash
        run: |
          set +e
          if [ -f Cargo.lock ]; then
            cargo test --locked 2>&1 | tee cargo-test.log
          else
            cargo test 2>&1 | tee cargo-test.log
          fi
          status=${PIPESTATUS[0]}
          {
            echo '## Cargo test output (last 240 lines)'
            echo '```text'
            tail -n 240 cargo-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Install cargo-near
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh

      - name: Build release WASM with cargo-near
        shell: bash
        run: |
          set +e
          cargo near build non-reproducible-wasm --no-abi 2>&1 | tee cargo-near-build.log
          status=${PIPESTATUS[0]}
          {
            echo '## cargo-near WASM build output (last 200 lines)'
            echo '```text'
            tail -n 200 cargo-near-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: nest-registry-wasm
          path: contracts/nest-registry/target/near/*.wasm
          if-no-files-found: error
