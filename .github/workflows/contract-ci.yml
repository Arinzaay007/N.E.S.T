name: NEAR contract CI

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contract-ci.yml"
  push:
    paths:
      - "contracts/**"
      - ".github/workflows/contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build registry WASM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/nest-registry
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust and NEAR WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/nest-registry

      - name: Run contract unit tests
        shell: bash
        run: |
          set +e
          if [ -f Cargo.lock ]; then
            cargo test --locked 2>&1 | tee cargo-test.log
          else
            cargo test 2>&1 | tee cargo-test.log
          fi
          status=${PIPESTATUS[0]}
          {
            echo '## Cargo test output (last 240 lines)'
            echo '```text'
            tail -n 240 cargo-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Build release WASM
        shell: bash
        run: |
          set +e
          cargo build --target wasm32-unknown-unknown --release 2>&1 | tee cargo-build.log
          status=${PIPESTATUS[0]}
          {
            echo '## Cargo WASM build output (last 160 lines)'
            echo '```text'
            tail -n 160 cargo-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: nest-registry-wasm
          path: contracts/nest-registry/target/wasm32-unknown-unknown/release/nest_registry.wasm
          if-no-files-found: error
